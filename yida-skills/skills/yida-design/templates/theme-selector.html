<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择界面风格</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #f5f6f8; color: #202938; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 1120px; margin: auto; padding: clamp(16px, 3vw, 32px); }
    h1 { margin: 0; font-size: 24px; line-height: 1.4; }
    p { margin: 8px 0 20px; color: #4b5563; }
    fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
    legend { margin-bottom: 16px; font-weight: 600; }
    .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
    .card { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 16px; background: #fff; border: 2px solid #c7cdd5; border-radius: 16px; cursor: pointer; overflow-wrap: anywhere; }
    .card:has(input:checked) { border-color: #3154ba; background: #f4f7ff; }
    .card:focus-within { outline: 3px solid #3154ba; outline-offset: 3px; }
    .heading { display: flex; align-items: flex-start; gap: 10px; font-size: 18px; font-weight: 650; }
    input { flex: 0 0 auto; width: 20px; height: 20px; margin: 5px 0 0; accent-color: #3154ba; }
    .preview { width: 100%; height: auto; margin: 16px 0 0; border-radius: 8px; }
    .description { display: block; margin-top: 12px; color: #414b5b; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { padding: 2px 8px; background: #e8edf8; color: #294480; border-radius: 6px; font-size: 14px; }
    footer { margin-top: 24px; }
    button { min-height: 44px; border: 0; padding: 10px 24px; border-radius: 10px; background: #3154ba; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #202938; outline-offset: 3px; }
    button:disabled { background: #e1e5eb; color: #505a69; cursor: default; }
    #status { margin: 12px 0 0; overflow-wrap: anywhere; }
    #reference-note { margin-top: 16px; font-size: 14px; }
    @media (max-width: 480px) { button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>选择界面风格</h1>
    <p>对照效果选择喜欢的风格，也可以直接在对话中描述偏好。</p>
    <fieldset id="choices">
      <legend>这几种界面风格，你更喜欢哪一种？</legend>
      <div id="themes" class="themes"></div>
    </fieldset>
    <p id="reference-note" hidden>效果参考图，实际内容、布局和品牌色按本次方案调整</p>
    <footer>
      <button id="confirm" type="button" disabled>确认风格，继续</button>
      <p id="status" role="status" aria-live="polite"></p>
    </footer>
  </main>
  <script>
    (function () {
      'use strict';
      const container = document.getElementById('themes');
      const choices = document.getElementById('choices');
      const confirm = document.getElementById('confirm');
      const status = document.getElementById('status');
      const note = document.getElementById('reference-note');
      const data = window.__WIDGET_DATA__ || {};
      const seen = new Set();
      const themes = (Array.isArray(data.themes) ? data.themes : []).filter(function (theme) {
        if (!theme || typeof theme.id !== 'string' || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(theme.id) ||
            typeof theme.name !== 'string' || !theme.name.trim() || seen.has(theme.id)) return false;
        seen.add(theme.id);
        return true;
      });
      let selected = themes.find(function (theme) { return theme.selected === true; }) || null;
      let sending = false;
      let sent = false;
      let visibleImages = 0;
      function textElement(tag, className, value) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = value;
        return element;
      }
      themes.forEach(function (theme, index) {
        const card = document.createElement('label');
        card.className = 'card';
        const heading = document.createElement('span');
        heading.className = 'heading';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'theme';
        radio.value = theme.id;
        radio.checked = selected === theme;
        const title = textElement('span', '', (index + 1) + ' · ' + theme.name);
        title.id = 'theme-title-' + index;
        radio.setAttribute('aria-labelledby', title.id);
        radio.addEventListener('change', function () {
          if (sending || sent || !radio.checked) return;
          selected = theme;
          confirm.disabled = false;
          status.textContent = '';
        });
        heading.appendChild(radio);
        heading.appendChild(title);
        card.appendChild(heading);
        if (typeof theme.img === 'string' && /^https:\/\//i.test(theme.img)) {
          const image = document.createElement('img');
          image.className = 'preview';
          image.alt = theme.name + ' · 效果参考图';
          image.hidden = true;
          let loaded = false;
          image.addEventListener('load', function () {
            if (!loaded) visibleImages += 1;
            loaded = true;
            image.hidden = false;
            note.hidden = false;
          });
          image.addEventListener('error', function () {
            if (loaded) visibleImages -= 1;
            loaded = false;
            image.remove();
            note.hidden = visibleImages === 0;
          });
          image.src = theme.img;
          card.appendChild(image);
        }
        if (typeof theme.desc === 'string' && theme.desc) {
          const description = textElement('span', 'description', theme.desc);
          description.id = 'theme-description-' + index;
          radio.setAttribute('aria-describedby', description.id);
          card.appendChild(description);
        }
        if (Array.isArray(theme.tags)) {
          const tags = document.createElement('span');
          tags.className = 'tags';
          theme.tags.filter(function (tag) { return typeof tag === 'string' && tag; }).forEach(function (tag) {
            tags.appendChild(textElement('span', 'tag', tag));
          });
          if (tags.childNodes.length) card.appendChild(tags);
        }
        container.appendChild(card);
      });
      confirm.disabled = !selected;
      if (!themes.length) status.textContent = '当前没有可选风格，请返回对话重新提供候选。';
      confirm.addEventListener('click', async function () {
        if (!selected || sending || sent) return;
        if (!window.__bridge || typeof window.__bridge.sendToAgent !== 'function') {
          status.textContent = '暂时无法回传选择，请稍后重试，或在对话中告诉我喜欢的风格。';
          return;
        }
        sending = true;
        confirm.disabled = true;
        choices.disabled = true;
        status.textContent = '正在提交选择…';
        try {
          await window.__bridge.sendToAgent(
            '已选择「' + selected.name + '」风格（themeId: ' + selected.id + '），请继续下一步'
          );
          sent = true;
          status.textContent = '已提交「' + selected.name + '」，请在对话中继续。';
        } catch (error) {
          status.textContent = '选择回传失败，请重试，或在对话中告诉我喜欢的风格。';
          confirm.disabled = false;
          choices.disabled = false;
        } finally {
          sending = false;
        }
      });
    }());
  </script>
</body>
</html>
